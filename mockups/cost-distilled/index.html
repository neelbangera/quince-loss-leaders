<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quince Ledger — cost chart, distilled</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens are the ones in DESIGN.md ("The White Oxford Shirt"). */
:root {
  --paper: #ffffff;
  --ink: #1b1b19;
  --soft: #6b6b66;
  --rule: #d9d9d3;
  --rule-soft: #ecece7;
  --hover: #f6f6f2;
  --claret: #7d1d2f;
  --stripe: #9db4d3;
  --serif: "EB Garamond", Garamond, Georgia, serif;
  --sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
}
:root[data-theme="dark"] {
  --paper: #131412;
  --ink: #efebe2;
  --soft: #a5a49c;
  --rule: #3a3b35;
  --rule-soft: #262722;
  --hover: #1c1d1a;
  --claret: #eba0aa;
  --stripe: #5d77a0;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-transform: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
p, h1, h2, h3, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; }
.fig { font-variant-numeric: tabular-nums; font-weight: 500; }
.soft { color: var(--soft); }
.below { color: var(--claret); }
.page { width: min(1400px, 100% - 64px); margin: 0 auto; }

/* ---- Mockup chrome (not part of the design) */
.top { padding: 32px 0 24px; border-bottom: 1px solid var(--ink); }
.top h1 { font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.1; }
.top p { margin-top: 8px; max-width: 70ch; color: var(--soft); }
.switches { display: flex; flex-wrap: wrap; gap: 14px 40px; margin-top: 22px; }
.switch { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
.switch > span { color: var(--soft); }
.switch button { color: var(--soft); padding-bottom: 3px; border-bottom: 2px solid transparent; }
.switch button:hover { color: var(--ink); }
.switch button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 88px; padding-bottom: 96px; }
.option { padding: 44px 0 52px; border-bottom: 1px solid var(--rule); min-width: 0; }
.option-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
.option-letter { font-family: var(--serif); font-size: 30px; line-height: 1; }
.option-why { color: var(--soft); max-width: 58ch; margin-bottom: 30px; font-size: 14px; }
.stage { max-width: 612px; }

/* ---- Shared sheet pieces */
.stage h3 { font-family: var(--serif); font-weight: 400; font-size: 24px; line-height: 1.2; margin-bottom: 18px; }
.item-line { font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--soft); margin-top: 22px; }
.hatch { background: repeating-linear-gradient(135deg, var(--claret) 0 1.5px, transparent 1.5px 6px); }

/* Cost-line colours. Claret stays reserved for "below cost"; none of these is a red. */
:root {
  --navy: #1f3a5f; --oxford: #7f9cc4; --forest: #2f5d46; --camel: #b98b52; --maize: #dcc06a; --stone: #a9a79c;
  --blue-1: #17304f; --blue-2: #33557f; --blue-3: #5f7fae; --blue-4: #8ea8cc; --blue-5: #b9cae2; --blue-6: #dde6f1;
  --make-1: #1f3a5f; --make-2: #5f7fae; --make-3: #b5c6de;
  --send-1: #8a5a24; --send-2: #c3965a; --send-3: #e6cfa8;
  --on-dark: #ffffff; --on-light: #1b1b19;
}
:root[data-theme="dark"] {
  --navy: #6f93c9; --oxford: #b4c8e6; --forest: #6fa888; --camel: #d0a56e; --maize: #e8d283; --stone: #8d8c84;
  --blue-1: #dde6f1; --blue-2: #b9cae2; --blue-3: #8ea8cc; --blue-4: #6f8fbe; --blue-5: #4d6c9c; --blue-6: #324c74;
  --make-1: #6f93c9; --make-2: #a3bbe0; --make-3: #d3dff0;
  --send-1: #b9853f; --send-2: #d6ae78; --send-3: #ecdcbd;
  --on-dark: #131412; --on-light: #131412;
}

.flag { position: relative; height: 46px; }
.flag > div { position: absolute; bottom: 8px; white-space: nowrap; line-height: 1.2; }
.flag strong { display: block; font-family: var(--serif); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums lining-nums; }
.bar { position: relative; display: flex; height: 52px; }
.segs { display: flex; gap: 2px; flex: none; }
/* No padding on the segment itself: padding would stop small lines shrinking to their true share. */
.seg { min-width: 2px; overflow: hidden; white-space: nowrap; font-size: 12px; line-height: 1.35; }
.seg > span { display: block; padding: 8px 10px; overflow: hidden; text-overflow: ellipsis; }
.seg b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.room { flex: 1; margin-left: 2px; border: 1px solid var(--rule); border-left: 0; }
.mark { position: absolute; top: -8px; bottom: -14px; width: 2px; background: var(--ink); }
.reach { display: flex; height: 9px; margin-top: 3px; }
.reach .paid { background: var(--ink); flex: none; }
.under { display: flex; justify-content: space-between; gap: 16px; margin-top: 14px; font-size: 14px; }
.key { display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; margin-top: 26px; border-top: 1px solid var(--rule); }
.key li { display: grid; grid-template-columns: 12px 1fr auto auto; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
.key i { width: 12px; height: 12px; }
.key .pc { color: var(--soft); font-size: 13px; width: 3em; text-align: right; }
.key .amt { width: 4.6em; text-align: right; }

/* Grouped option: brackets under the bar name the two halves */
.groups { display: flex; gap: 2px; margin-top: 6px; }
.groups > div { border-top: 1px solid var(--ink); padding-top: 7px; min-width: 0; font-size: 13px; line-height: 1.3; white-space: nowrap; }
.groups b { display: block; font-weight: 600; }
.key.grouped { grid-template-columns: 1fr 1fr; }
.key.grouped > div > p { padding: 12px 0 8px; color: var(--soft); border-bottom: 1px solid var(--rule-soft); }

/* Two-bar option: the price over the cost, on one scale */
.pair { display: grid; grid-template-columns: 7.5em 1fr; gap: 12px 16px; align-items: center; }
.pair .name b { display: block; font-family: var(--serif); font-weight: 400; font-size: 20px; font-variant-numeric: tabular-nums lining-nums; line-height: 1.2; }
.pair .track { display: flex; height: 52px; }
.pair .ink { background: var(--ink); flex: none; }
.pair .gap { flex: 1; }
.pair .gap.over { margin-left: 2px; border: 1px solid var(--rule); border-left: 0; }

/* A: dimension lines, the way a tailor marks a measurement */
.dimrow { display: flex; align-items: flex-end; height: 56px; margin-bottom: 10px; }
.dim { position: relative; flex: none; min-width: 0; padding-bottom: 8px; border-bottom: 1px solid currentColor; white-space: nowrap; line-height: 1.2; }
.dim::before, .dim::after { content: ""; position: absolute; bottom: -5px; width: 1px; height: 9px; background: currentColor; }
.dim::before { left: 0; }
.dim::after { right: 0; }
.dim b { display: block; font-family: var(--serif); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums lining-nums; }
.dim.short { flex: 1; margin-left: 3px; display: flex; flex-direction: column; align-items: flex-end; }
.room.said { display: flex; align-items: center; padding-left: 12px; font-size: 13px; white-space: nowrap; overflow: hidden; }

/* B: a slim ink measuring stick laid along the top of the cost bar */
.heads { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 8px; line-height: 1.2; }
.heads b { display: block; font-family: var(--serif); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums lining-nums; }
.heads > div:last-child { text-align: right; color: var(--soft); }
.stick { display: flex; height: 14px; margin-bottom: 3px; }
.stick .ink { flex: none; background: var(--ink); }
.stick .hatch { flex: 1; }

/* C: the price fills the bar; what it does not reach stays pale */
.fill { position: relative; height: 52px; }
.fill .layer { position: absolute; top: 0; bottom: 0; left: 0; display: flex; gap: 2px; }
.fill .pale { opacity: 0.25; }
.fill .unreached { position: absolute; top: 0; bottom: 0; right: 0; }
.fill .room { position: absolute; top: 0; bottom: 0; right: 0; margin: 0; }

/* D: a pin for the price and a claret frame around what it leaves uncovered */
.frame { position: absolute; top: -3px; bottom: -3px; right: -3px; border: 2px solid var(--claret); }

/* Two bars on one scale */
.rows { display: grid; grid-template-columns: 9.5em 1fr; gap: 14px 18px; align-items: center; }
.rows .name { line-height: 1.25; }
.rows .name b, .over b { display: block; font-family: var(--serif); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums lining-nums; }
.track { display: flex; height: 48px; }
.track .ink { flex: none; background: var(--ink); }
.track .rest { flex: 1; }
.track .open { flex: 1; margin-left: 2px; border: 1px solid var(--rule); border-left: 0; }
.track .pad { flex: none; }
.track .piece { flex: none; }
.track .piece.fold { border: 1px solid var(--ink); }
.stack > .over { display: flex; align-items: baseline; gap: 12px; margin: 0 0 8px; }
.stack > .over b { font-size: 24px; }
.stack > .track { margin-bottom: 22px; }
.sum { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.sum p { font-family: var(--serif); font-size: 22px; line-height: 1.2; }
.sum .fig { font-family: var(--serif); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
.key.grouped > div > p { display: flex; justify-content: space-between; gap: 12px; }
.key.grouped > div > p span { letter-spacing: 0; text-transform: none; font-weight: 500; font-size: 13px; }

/* Distilled: label, bar, figure. The three figures stack like a sum. */
.sumgrid { display: grid; grid-template-columns: 136px 1fr auto; column-gap: 18px; row-gap: 10px; align-items: center; }
.sumgrid .lab { color: var(--soft); }
.sumgrid .num { font-family: var(--serif); font-size: 23px; line-height: 1.1; text-align: right; font-variant-numeric: tabular-nums lining-nums; }
.sumgrid .t { display: flex; position: relative; }
.sumgrid .t .ink { flex: none; background: var(--ink); }
.sumgrid .t .pad { flex: none; }
.sumgrid .t .piece { flex: none; min-width: 3px; }
.sumgrid .t .piece.over { border: 1px solid var(--ink); }
.sumgrid > div { display: contents; }
.sumgrid .total .lab { color: var(--ink); }
.sumgrid .result.below .lab, .sumgrid .result.below .num { color: var(--claret); }
.sumgrid .total .num { border-top: 1px solid currentColor; padding-top: 9px; margin-top: 1px; }
.sumgrid .segs.split { gap: 6px; }

/* Lines as running text: one line per family */
.runs { margin-top: 26px; border-top: 1px solid var(--rule); }
.runs > div { display: grid; grid-template-columns: 136px 1fr; column-gap: 18px; align-items: baseline; padding: 13px 0; border-bottom: 1px solid var(--rule-soft); }
.runs .its { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.runs .fam { color: var(--soft); }
.runs .fam b { display: block; color: var(--ink); font-family: var(--sans); font-size: 15px; font-weight: 500; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; margin-top: 2px; }
.runs .it { display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.runs .it i { width: 10px; height: 10px; align-self: center; }
.runs .it .fig { color: var(--soft); }

/* Lines as two plain columns */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; margin-top: 26px; border-top: 1px solid var(--rule); }
.cols p { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0 6px; }
.cols p span:first-child { color: var(--soft); }
.cols li { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px; padding: 6px 0; }
.cols li i { width: 10px; height: 10px; }

/* Lines on request */
.fold { margin-top: 22px; border-top: 1px solid var(--rule); }
.fold summary { list-style: none; cursor: pointer; padding: 13px 0; display: flex; justify-content: space-between; align-items: center; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary::after { content: ""; width: 6px; height: 6px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); margin: -3px 3px 0 0; }
.fold[open] summary::after { transform: rotate(-135deg); margin-top: 3px; }
.fold .runs { margin-top: 0; }

.track { position: relative; }
.track .line { flex: none; border: 1.5px solid var(--ink); }
.track .gapnote { align-self: center; padding-left: 10px; font-size: 13px; white-space: nowrap; }
.guide { position: absolute; top: -8px; bottom: -8px; width: 0; border-left: 1px dashed var(--ink); }
.segs.split { gap: 10px; }
.segs.split > div { display: flex; gap: 2px; min-width: 0; }
.heads2 { display: flex; gap: 10px; font-size: 12px; line-height: 1.3; white-space: nowrap; margin-bottom: -8px; }
.heads2 > div { min-width: 0; }
.heads2 b { font-weight: 600; }

@media (max-width: 640px) {
  .sumgrid { display: block; }
  .sumgrid > div { display: grid; grid-template-columns: 1fr auto; align-items: baseline; row-gap: 6px; margin-bottom: 16px; }
  .sumgrid .t { grid-column: 1 / -1; grid-row: 2; }
  .sumgrid .total .num { border-top: 0; padding-top: 0; }
  .sumgrid .total { border-top: 1px solid var(--rule); padding-top: 14px; }
  .cols { grid-template-columns: 1fr; }
  .runs > div { grid-template-columns: 1fr; row-gap: 8px; }
  .runs .fam { display: flex; justify-content: space-between; align-items: baseline; }
  .rows { grid-template-columns: 1fr; gap: 6px; }
  .rows .name { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; }
}
@media (max-width: 1180px) { .options { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
  .page { width: calc(100% - 32px); }
  .key, .key.grouped { grid-template-columns: 1fr; }
  .pair { grid-template-columns: 1fr; gap: 4px; }
  .pair .track { margin-bottom: 12px; }
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>The cost chart, distilled: three cuts</h1>
    <p>Still two bars, still every figure: the price, the cost, the difference, both families and all six lines. What goes is everything said twice. Each cut removes a little more. Switch the item and the theme to compare.</p>
    <div class="switches label">
      <div class="switch" id="items" role="group" aria-label="Item"><span>Item</span></div>
      <div class="switch" id="themes" role="group" aria-label="Theme">
        <span>Theme</span>
        <button type="button" data-theme-set="light">Light</button>
        <button type="button" data-theme-set="dark">Dark</button>
      </div>
    </div>
  </header>
  <main class="options" id="options"></main>
</div>

<script>
const ITEMS = [
  {
    id: "sweater", tab: "Small shortfall",
    name: "Women's 100% Organic Cotton Fisherman Crew Sweater", variant: "In Sapphire Blue · XS",
    price: 42.00,
    lines: [["Materials", 5.09], ["Crafting Cost", 5.96], ["Packaging", 0.20], ["Freight & Handling", 26.18], ["Credit Card Fees", 1.26], ["Duties, Taxes, And Fees", 9.30]],
  },
  {
    id: "rug", tab: "Huge shortfall",
    name: "Sahara Hand-Tufted Wool Rug", variant: "8'9\" x 11'9\"",
    price: 59.90,
    lines: [["Materials", 248.00], ["Crafting Cost", 200.00], ["Packaging", 2.00], ["Freight & Handling", 29.00], ["Credit Card Fees", 0.15], ["Duties, Taxes, And Fees", 0.00]],
  },
  {
    id: "coat", tab: "Above cost",
    name: "100% Mongolian Cashmere Trench Coat", variant: "In Heather Taupe · XS",
    price: 600.00,
    lines: [["Materials", 293.01], ["Crafting Cost", 29.00], ["Packaging", 2.00], ["Freight & Handling", 8.04], ["Credit Card Fees", 19.96], ["Duties, Taxes, And Fees", 30.00]],
  },
];

const money = (value) => (value < 0 ? "−" : "") + "$" + Math.abs(value).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (part, whole) => (whole ? (part / whole) * 100 : 0);
const share = (part, whole) => { const value = pct(part, whole); return value === 0 ? "0%" : value < 1 ? "<1%" : Math.round(value) + "%"; };
const esc = (text) => text.replace(/&/g, "&amp;").replace(/</g, "&lt;");

function facts(item) {
  const cost = item.lines.reduce((sum, line) => sum + line[1], 0);
  const gap = item.price - cost;
  return { cost, gap, below: gap < 0, scale: Math.max(cost, item.price) };
}
const bySize = (lines) => [...lines].sort((left, right) => right[1] - left[1]);

// Colour belongs to the cost line, not to its rank, so Materials is the same colour on every item.
const PREP = {
  "Materials": ["--navy", "--on-dark"], "Crafting Cost": ["--oxford", "--on-light"], "Packaging": ["--stone", "--on-light"],
  "Freight & Handling": ["--forest", "--on-dark"], "Duties, Taxes, And Fees": ["--camel", "--on-light"], "Credit Card Fees": ["--maize", "--on-light"],
};
const GROUPS = [
  ["Making it", [["Materials", "--make-1", "--on-dark"], ["Crafting Cost", "--make-2", "--on-light"], ["Packaging", "--make-3", "--on-light"]]],
  ["Getting it to you", [["Freight & Handling", "--send-1", "--on-dark"], ["Duties, Taxes, And Fees", "--send-2", "--on-light"], ["Credit Card Fees", "--send-3", "--on-light"]]],
];
const BLUES = [["--blue-1", "--on-dark"], ["--blue-2", "--on-dark"], ["--blue-3", "--on-light"], ["--blue-4", "--on-light"], ["--blue-5", "--on-light"], ["--blue-6", "--on-light"]];
const prepSegs = (item) => bySize(item.lines).map(([label, amount]) => ({ label, amount, bg: PREP[label][0], fg: PREP[label][1] }));
const blueSegs = (item) => bySize(item.lines).map(([label, amount], index) => ({ label, amount, bg: BLUES[index][0], fg: BLUES[index][1] }));
const groupSegs = (item) => GROUPS.map(([name, lines]) => ({
  name,
  segs: lines.map(([label, bg, fg]) => ({ label, amount: (item.lines.find((line) => line[0] === label) ?? [label, 0])[1], bg, fg })),
}));

const segHtml = (segs, cost) => segs.filter((seg) => seg.amount > 0).map((seg) => {
  const part = pct(seg.amount, cost);
  const text = part > 24 ? `<b>${esc(seg.label)}</b>${money(seg.amount)}` : part > 11 ? money(seg.amount) : "";
  return `<div class="seg" style="flex:${seg.amount} 0 0;background:var(${seg.bg});color:var(${seg.fg})" title="${esc(seg.label)} ${money(seg.amount)}">${text ? `<span>${text}</span>` : ""}</div>`;
}).join("");
const keyRow = (seg, cost) => `<li><i style="background:var(${seg.bg})"></i><span>${esc(seg.label)}</span><span class="pc fig">${share(seg.amount, cost)}</span><span class="amt fig">${money(seg.amount)}</span></li>`;

function flagAndBar(item, f, segs, extra = "") {
  const costWidth = pct(f.cost, f.scale);
  const priceAt = pct(item.price, f.scale);
  const flagRight = priceAt > 55;
  return `<div class="flag"><div style="${flagRight ? `right:${(100 - priceAt).toFixed(2)}%;text-align:right` : `left:${priceAt.toFixed(2)}%`}">
      <span class="label soft">You pay</span><strong>${money(item.price)}</strong>
    </div></div>
    <div class="bar">
      <div class="segs" style="width:${costWidth.toFixed(2)}%">${segHtml(segs, f.cost)}</div>
      ${f.below ? "" : `<div class="room"></div>`}
      <div class="mark" style="left:calc(${priceAt.toFixed(2)}% - ${priceAt > 99 ? 2 : 1}px)"></div>
    </div>
    <div class="reach"><span class="paid" style="width:${priceAt.toFixed(2)}%"></span>${f.below ? `<span class="hatch" style="flex:1"></span>` : ""}</div>
    ${extra}
    <p class="under">
      <span class="soft">Reported cost <span class="fig">${money(f.cost)}</span></span>
      <span class="${f.below ? "below" : ""}"><span class="fig">${money(Math.abs(f.gap))}</span> ${f.below ? "of the cost is not covered by the price" : "above the reported cost"}</span>
    </p>`;
}

// Three cuts of one design. `o.height` is the bar height; `o.lines` is how the six cost lines are shown.
function build(item, o) {
  const f = facts(item); const groups = groupSegs(item);
  const costWidth = pct(f.cost, f.scale); const priceWidth = pct(item.price, f.scale);
  const sums = groups.map((group) => group.segs.reduce((total, seg) => total + seg.amount, 0));
  const bar = (segs) => segs.filter((seg) => seg.amount > 0).map((seg) => `<div class="seg" style="flex:${seg.amount} 0 0;background:var(${seg.bg})" title="${esc(seg.label)} ${money(seg.amount)}"></div>`).join("");
  const costBar = `<div class="segs split" style="width:${costWidth.toFixed(2)}%">${groups.map((group, index) => (sums[index] > 0 ? `<div style="display:flex;gap:2px;min-width:0;flex:${sums[index]} 0 0">${bar(group.segs)}</div>` : "")).join("")}</div>`;
  const low = Math.min(costWidth, priceWidth); const gapWidth = Math.abs(costWidth - priceWidth);
  const word = f.below ? "Below cost" : f.gap > 0 ? "Above cost" : "At cost";
  // On a phone the DOM order puts each label and figure on one line with its bar beneath.
  const row = (label, figure, track, cls = "") => `<div class="${cls}">
      <span class="lab label">${label}</span>
      <div class="t" style="height:${o.height}px">${track}</div>
      <span class="num">${figure}</span>
    </div>`;
  const sum = `<div class="sumgrid">
      ${row("Costs Quince", money(f.cost), costBar, "result plain")}
      ${row("Sells for", money(item.price), `<span class="ink" style="width:${priceWidth.toFixed(2)}%"></span>`, "result plain")}
      ${row(word, f.gap === 0 ? money(0) : (f.gap > 0 ? "+" : "") + money(f.gap), f.gap === 0 ? "" : `<span class="pad" style="width:${low.toFixed(2)}%"></span><span class="piece ${f.below ? "hatch" : "over"}" style="width:${gapWidth.toFixed(2)}%"></span>`, `result total ${f.below ? "below" : ""}`)}
    </div>`;
  const runs = `<div class="runs">${groups.map((group, index) => `<div>
      <span class="fam label">${group.name}<b>${money(sums[index])}</b></span>
      <span class="its">${group.segs.map((seg) => `<span class="it"><i style="background:var(${seg.bg})"></i>${esc(seg.label)}<span class="fig">${money(seg.amount)}</span></span>`).join("")}</span>
    </div>`).join("")}</div>`;
  const cols = `<div class="cols">${groups.map((group, index) => `<div>
      <p><span class="label">${group.name}</span><span class="fig">${money(sums[index])}</span></p>
      <ul>${group.segs.map((seg) => `<li><i style="background:var(${seg.bg})"></i><span>${esc(seg.label)}</span><span class="fig">${money(seg.amount)}</span></li>`).join("")}</ul>
    </div>`).join("")}</div>`;
  const lines = o.lines === "runs" ? runs : o.lines === "cols" ? cols
    : `<details class="fold"><summary class="label"><span>The six cost lines</span></summary>${runs}</details>`;
  return `<h3>What Quince says it costs</h3>${sum}${lines}`;
}

const OPTIONS = [
  ["1", "The sum", "Label, bar, figure. The three figures line up on the right like arithmetic: cost, price, and the difference under a rule, so the verdict sentence is gone. The six lines become two lines of running text, one per family. Removed: text inside the bar, the percentage column, the separate list headings.", (item) => build(item, { height: 26, lines: "runs" })],
  ["2", "The sum, with the lines in two columns", "The same sum with slimmer bars. The six lines stay as rows, in two plain columns headed by each family's total, for anyone who wants to read amounts straight down. Removed: text inside the bar, the percentage column, the verdict sentence.", (item) => build(item, { height: 14, lines: "cols" })],
  ["3", "The sum, lines on request", "Only the three figures and their bars are shown. The six lines sit one click away under a single ruled row. Nothing is lost, but the detail waits until it is asked for.", (item) => build(item, { height: 26, lines: "fold" })],
];

let current = ITEMS[0];
function render() {
  document.getElementById("options").innerHTML = OPTIONS.map(([letter, title, why, build]) => `
    <section class="option">
      <div class="option-head"><span class="option-letter">${letter}</span><span class="label">${title}</span></div>
      <p class="option-why">${why}</p>
      <div class="stage">${build(current)}<p class="item-line">${esc(current.name)} · ${esc(current.variant)}</p></div>
    </section>`).join("");
  document.querySelectorAll("#items button").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.item === current.id)));
}

const items = document.getElementById("items");
for (const item of ITEMS) {
  const button = document.createElement("button");
  button.type = "button";
  button.dataset.item = item.id;
  button.textContent = item.tab;
  button.addEventListener("click", () => { current = item; render(); });
  items.append(button);
}
function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll("[data-theme-set]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.themeSet === theme)));
}
document.querySelectorAll("[data-theme-set]").forEach((button) => button.addEventListener("click", () => setTheme(button.dataset.themeSet)));

// Deep links for screenshots: #rug, #coat, #dark (comma-separated).
const flags = location.hash.slice(1).split(",");
current = ITEMS.find((item) => flags.includes(item.id)) ?? ITEMS[0];
setTheme(flags.includes("dark") ? "dark" : "light");
render();
</script>
</body>
</html>
